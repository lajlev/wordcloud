<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f0eb;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  #controls {
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    padding: 20px 28px;
    margin-bottom: 20px;
    max-width: 1200px;
    width: 100%;
  }

  .control-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .control-row:last-child { margin-bottom: 0; }

  .control-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #888;
    min-width: 90px;
    flex-shrink: 0;
  }

  .toggle-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .toggle-btn {
    border: 2px solid #e0d8d0;
    background: white;
    border-radius: 10px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #666;
    white-space: nowrap;
  }
  .toggle-btn:hover {
    border-color: #c0b8b0;
    background: #faf8f5;
  }
  .toggle-btn.active {
    border-color: #a08070;
    background: #a08070;
    color: white;
    box-shadow: 0 2px 8px rgba(160,128,112,0.3);
  }


  .action-group {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .action-btn {
    border: 2px solid #e0d8d0;
    background: white;
    border-radius: 10px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #666;
  }
  .action-btn:hover {
    border-color: #a08070;
    color: #a08070;
  }

  #canvas-wrapper {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.1);
    padding: 0;
    overflow: hidden;
    max-width: 1190px;
    width: 100%;
    aspect-ratio: 1190 / 842;
  }

  #cloud-svg {
    display: block;
    width: 100%;
    height: 100%;
    transition: opacity 0.15s ease;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(40,30,25,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 50px rgba(0,0,0,0.25);
    padding: 28px 32px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
    color: #444;
    margin-bottom: 18px;
  }
  .modal-field { margin-bottom: 16px; }
  .modal-field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #888;
    margin-bottom: 6px;
  }
  .modal-field input,
  .modal-field textarea {
    width: 100%;
    border: 2px solid #e0d8d0;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    font-family: inherit;
    color: #444;
  }
  .modal-field textarea {
    resize: vertical;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    line-height: 1.5;
  }
  .modal-field input:focus,
  .modal-field textarea:focus {
    outline: none;
    border-color: #a08070;
  }
  .modal-hint {
    font-size: 11px;
    color: #999;
    margin-top: 6px;
  }
  .modal-hint code {
    background: #f5f0eb;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
  }
  .modal-example {
    background: #f5f0eb;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 6px;
    font-size: 11px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    color: #777;
    line-height: 1.5;
    white-space: pre;
  }
  .modal-error {
    color: #c0392b;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .modal-error[hidden] { display: none; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .modal-primary {
    border-color: #a08070;
    background: #a08070;
    color: white;
  }
  .modal-primary:hover {
    border-color: #8a6a5a;
    background: #8a6a5a;
    color: white;
  }

  /* ── Custom dropdowns ── */
  .dropdown {
    position: relative;
    min-width: 260px;
  }
  .dropdown-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    border: 2px solid #e0d8d0;
    background: white;
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    color: #555;
    transition: all 0.2s ease;
  }
  .dropdown-trigger:hover { border-color: #c0b8b0; background: #faf8f5; }
  .dropdown.open .dropdown-trigger { border-color: #a08070; box-shadow: 0 2px 8px rgba(160,128,112,0.18); }
  .dropdown-current { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; overflow: hidden; }
  .dropdown-caret { color: #aaa; font-size: 10px; flex-shrink: 0; transition: transform 0.2s ease; }
  .dropdown.open .dropdown-caret { transform: rotate(180deg); }
  .dropdown-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 60;
    background: white;
    border: 2px solid #e0d8d0;
    border-radius: 12px;
    box-shadow: 0 8px 34px rgba(0,0,0,0.14);
    padding: 6px;
    max-height: 360px;
    overflow-y: auto;
  }
  .dropdown-menu[hidden] { display: none; }
  .dropdown-option {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
    color: #555;
    text-align: left;
    transition: background 0.15s ease;
  }
  .dropdown-option:hover { background: #faf8f5; }
  .dropdown-option.active { background: #a08070; color: white; }
  .dropdown-option.active .swatch-row { box-shadow: 0 0 0 2px rgba(255,255,255,0.6); }

  .swatch-row {
    display: inline-flex;
    border-radius: 5px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .swatch { width: 18px; height: 18px; }
  .pal-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .font-serif-sample { flex: 1; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .font-script-sample { font-size: 19px; color: #a08070; flex-shrink: 0; }
  .dropdown-option.active .font-script-sample { color: #fff; }

  /* ── PayPal donate ── */
  .donate-form { display: inline-flex; align-items: center; margin: 0; }
  .donate-form input[type="image"] { height: 34px; width: auto; display: block; }

  @media print {
    body {
      background: white;
      padding: 0;
    }
    #controls { display: none !important; }
    #canvas-wrapper {
      box-shadow: none;
      border-radius: 0;
      max-width: none;
      width: 297mm;
      height: 210mm;
    }
    @page {
      size: A4 landscape;
      margin: 0;
    }
  }
</style>

// ── Seeded RNG ──
function mulberry32(a) {
  return function() {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── Text Measurement ──
var mCanvas = document.createElement('canvas');
var mCtx = mCanvas.getContext('2d');

function measureText(text, fontSize, fontFamily) {
  mCtx.font = fontSize + 'px "' + fontFamily + '"';
  var m = mCtx.measureText(text);
  var w = m.width;
  var asc = m.actualBoundingBoxAscent;
  var desc = m.actualBoundingBoxDescent;
  var h;
  if (asc !== undefined && desc !== undefined) {
    h = asc + desc;
  } else {
    h = fontSize * 0.85;
  }
  return { w: w, h: h };
}

// ── OBB Collision Detection (SAT) ──
function makeOBB(cx, cy, hw, hh, angle) {
  return { cx: cx, cy: cy, hw: hw, hh: hh, angle: angle };
}

function obbOverlap(a, b) {
  var cosA = Math.cos(a.angle), sinA = Math.sin(a.angle);
  var cosB = Math.cos(b.angle), sinB = Math.sin(b.angle);
  var dx = b.cx - a.cx, dy = b.cy - a.cy;

  var axes = [
    { x: cosA, y: sinA },
    { x: -sinA, y: cosA },
    { x: cosB, y: sinB },
    { x: -sinB, y: cosB }
  ];

  for (var i = 0; i < 4; i++) {
    var ax = axes[i].x, ay = axes[i].y;
    var projA = Math.abs(a.hw * (ax * cosA + ay * sinA)) +
                Math.abs(a.hh * (-ax * sinA + ay * cosA));
    var projB = Math.abs(b.hw * (ax * cosB + ay * sinB)) +
                Math.abs(b.hh * (-ax * sinB + ay * cosB));
    var dist = Math.abs(dx * ax + dy * ay);
    if (dist > projA + projB) return false;
  }
  return true;
}

function getOBBCorners(o) {
  var c = Math.cos(o.angle), s = Math.sin(o.angle);
  var dx1 = o.hw * c, dy1 = o.hw * s;
  var dx2 = -o.hh * s, dy2 = o.hh * c;
  return [
    { x: o.cx + dx1 + dx2, y: o.cy + dy1 + dy2 },
    { x: o.cx - dx1 + dx2, y: o.cy - dy1 + dy2 },
    { x: o.cx - dx1 - dx2, y: o.cy - dy1 - dy2 },
    { x: o.cx + dx1 - dx2, y: o.cy + dy1 - dy2 }
  ];
}

function isInBounds(obb, W, H, margin) {
  var corners = getOBBCorners(obb);
  for (var i = 0; i < 4; i++) {
    if (corners[i].x < margin || corners[i].x > W - margin ||
        corners[i].y < margin || corners[i].y > H - margin) {
      return false;
    }
  }
  return true;
}

// ── Circle-OBB Collision ──
function circleOBBOverlap(cirX, cirY, cirR, obb) {
  var dx = cirX - obb.cx, dy = cirY - obb.cy;
  var cos = Math.cos(-obb.angle), sin = Math.sin(-obb.angle);
  var localX = dx * cos - dy * sin;
  var localY = dx * sin + dy * cos;
  var closestX = Math.max(-obb.hw, Math.min(obb.hw, localX));
  var closestY = Math.max(-obb.hh, Math.min(obb.hh, localY));
  var distX = localX - closestX, distY = localY - closestY;
  return (distX * distX + distY * distY) <= cirR * cirR;
}

// ── Spiral generators ──
function spiralArchimedean(step, cx, cy, a, aspectX, aspectY) {
  var t = step * 0.08;
  var r = a * t;
  return { x: cx + r * Math.cos(t) * aspectX, y: cy + r * Math.sin(t) * aspectY };
}

function spiralRectangular(step, cx, cy, spacing) {
  var x = 0, y = 0;
  var dxDir = spacing, dyDir = 0;
  var segLen = 1, segPassed = 0, turns = 0;
  for (var i = 0; i < step; i++) {
    x += dxDir;
    y += dyDir;
    segPassed++;
    if (segPassed >= segLen) {
      segPassed = 0;
      var tmp = dxDir;
      dxDir = -dyDir;
      dyDir = tmp;
      turns++;
      if (turns % 2 === 0) segLen++;
    }
  }
  return { x: cx + x, y: cy + y };
}

// ── Angle functions per layout ──
function getWordAngle(layoutId, idx, total, rng, px, py, cx, cy) {
  switch (layoutId) {
    case 'gentle':
      var opts = [0, 0, 0, 0, -0.22, 0.22, -0.15, 0.15];
      return opts[Math.floor(rng() * opts.length)];
    case 'classic':
      return rng() < 0.35 ? Math.PI / 2 : 0;
    case 'playful':
      var angles = [-0.44, -0.17, 0, 0.17, 0.44];
      return angles[Math.floor(rng() * angles.length)];
    case 'horizontal':
      return 0;
    case 'starburst':
      var ang = Math.atan2(py - cy, px - cx);
      if (Math.abs(ang) > Math.PI / 2) ang += Math.PI;
      return ang;
    default:
      return 0;
  }
}

// ── Font assignment ──
function getWordFont(fontSet, idx, total, count, maxCount, rng) {
  var t = count / maxCount;
  var useSerif = t > 0.3 ? rng() < 0.7 : rng() < 0.35;
  if (useSerif) {
    return '"' + fontSet.serif + '", ' + fontSet.serifFallback;
  }
  return '"' + fontSet.script + '", ' + fontSet.scriptFallback;
}

// ── Font size scaling ──
function calcFontSize(count, minC, maxC, minS, maxS) {
  if (maxC === minC) return (minS + maxS) / 2;
  var t = (count - minC) / (maxC - minC);
  return minS + (maxS - minS) * Math.pow(t, 0.65);
}

// ── Main placement engine ──
var SVG_W = 1190, SVG_H = 842;
var MARGIN = 30;
var PADDING = 4;
var CLOUD_BOTTOM = SVG_H - 45;

function placeWords() {
  var rng = mulberry32(state.seed);
  var palette = PALETTES[state.palette];
  var fontSet = FONT_SETS[state.fonts];
  var layoutId = LAYOUTS[state.layout].id;

  var words = DATA.words.slice().sort(function(a, b) { return b.count - a.count; });
  var maxC = words[0].count;
  var minC = words[words.length - 1].count;
  var maxFontSize = 78;
  var minFontSize = 15;

  var cx = SVG_W / 2;
  var cy = (MARGIN + CLOUD_BOTTOM) / 2;
  var placed = [];

  var centerMode = CENTER_MODES[state.center].id;
  if (centerMode === 'name') {
    var nameMeas = measureText(CENTER_NAME, CENTER_NAME_SIZE, fontSet.serif);
    placed.push({ obb: makeOBB(cx, cy, nameMeas.w / 2 + 20, CENTER_NAME_SIZE * 0.55 + 10, 0), isExclusion: true });
  }

  for (var wi = 0; wi < words.length; wi++) {
    var word = words[wi];
    var fontSize = calcFontSize(word.count, minC, maxC, minFontSize, maxFontSize);
    var font = getWordFont(fontSet, wi, words.length, word.count, maxC, rng);
    var color = palette.colors[wi % palette.colors.length];
    var meas = measureText(word.word, fontSize, font.split(',')[0].replace(/"/g, ''));
    var hw = meas.w / 2 + PADDING;
    var hh = meas.h / 2 + PADDING;

    var isPlaced = false;
    var maxSteps = 12000;

    for (var step = 0; step < maxSteps; step++) {
      var pos;
      var spiralA = layoutId === 'classic' ? 1.2 : layoutId === 'horizontal' ? 1.8 : layoutId === 'starburst' ? 2.0 : 1.6;
      pos = spiralArchimedean(step, cx, cy, spiralA, 1.4, 1.0);

      var angle = getWordAngle(layoutId, wi, words.length, rng, pos.x, pos.y, cx, cy);

      var cosA = Math.cos(angle), sinA = Math.sin(angle);
      var rotHW = Math.abs(hw * cosA) + Math.abs(hh * sinA);
      var rotHH = Math.abs(hw * sinA) + Math.abs(hh * cosA);

      if (pos.x - rotHW < MARGIN || pos.x + rotHW > SVG_W - MARGIN ||
          pos.y - rotHH < MARGIN || pos.y + rotHH > CLOUD_BOTTOM) {
        continue;
      }

      var obb = makeOBB(pos.x, pos.y, hw, hh, angle);
      var overlaps = false;
      if (centerMode === 'photo' && circleOBBOverlap(cx, cy, PHOTO_EXCLUSION_R, obb)) {
        overlaps = true;
      }
      if (!overlaps) {
        for (var pi = 0; pi < placed.length; pi++) {
          if (obbOverlap(obb, placed[pi].obb)) {
            overlaps = true;
            break;
          }
        }
      }

      if (!overlaps) {
        placed.push({
          word: word.word,
          count: word.count,
          x: pos.x,
          y: pos.y,
          fontSize: fontSize,
          angle: angle,
          font: font,
          color: color,
          obb: obb
        });
        isPlaced = true;
        break;
      }
    }
  }

  return placed;
}

// ── SVG Rendering ──
function renderSVG(placements) {
  var svg = document.getElementById('cloud-svg');
  svg.style.opacity = '0';

  var fontSet = FONT_SETS[state.fonts];
  var titleFont = '"' + fontSet.serif + '", ' + fontSet.serifFallback;

  var palette = PALETTES[state.palette];
  var centerMode = CENTER_MODES[state.center].id;
  var cx = SVG_W / 2, cy = (MARGIN + CLOUD_BOTTOM) / 2;

  var parts = [];
  parts.push('<rect width="1190" height="842" fill="white"/>');

  if (centerMode === 'photo') {
    parts.push('<defs><clipPath id="photo-clip"><circle cx="' + cx + '" cy="' + cy + '" r="' + PHOTO_RADIUS + '"/></clipPath></defs>');
    parts.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + (PHOTO_RADIUS + 3) + '" fill="none" stroke="#d8c8b8" stroke-width="2.5"/>');
    parts.push('<image href="' + PHOTO_URI + '" x="' + (cx - PHOTO_RADIUS - 10) + '" y="' + (cy - PHOTO_RADIUS - 10) + '" width="' + (PHOTO_RADIUS * 2 + 20) + '" height="' + (PHOTO_RADIUS * 2 + 20) + '" clip-path="url(#photo-clip)" preserveAspectRatio="xMidYMid slice"/>');
  } else if (centerMode === 'name') {
    parts.push('<text x="' + cx + '" y="' + cy + '" text-anchor="middle" dominant-baseline="central"' +
      ' font-family="' + escAttr(titleFont) + '" font-size="' + CENTER_NAME_SIZE + '"' +
      ' fill="' + palette.colors[0] + '" opacity="0.8">' + escXml(CENTER_NAME) + '</text>');
  }

  for (var i = 0; i < placements.length; i++) {
    var p = placements[i];
    if (p.isExclusion) continue;
    var angleDeg = (p.angle * 180 / Math.PI).toFixed(2);
    var op = (0.78 + 0.22 * (p.count / DATA.words[0].count)).toFixed(2);
    parts.push(
      '<text x="0" y="0" transform="translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ') rotate(' + angleDeg + ')"' +
      ' font-family="' + escAttr(p.font) + '"' +
      ' font-size="' + p.fontSize.toFixed(1) + '"' +
      ' fill="' + p.color + '"' +
      ' opacity="' + op + '"' +
      ' text-anchor="middle" dominant-baseline="central">' +
      escXml(p.word) + '</text>'
    );
  }

  parts.push(
    '<text x="595" y="826" text-anchor="middle" font-family="' + escAttr(titleFont) + '"' +
    ' font-size="13" fill="#b0a090" letter-spacing="2.5" font-variant="small-caps">' +
    escXml(DATA.title) + '</text>'
  );

  svg.innerHTML = parts.join('\n');
  requestAnimationFrame(function() { svg.style.opacity = '1'; });
}

function escXml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

function paletteOptionHTML(pal) {

var DROPDOWNS = {};
function setupDropdown(id, items, key, renderInner) {
  var dd = document.getElementById(id);
  var menu = dd.querySelector('.dropdown-menu');
  var trigger = dd.querySelector('.dropdown-trigger');
  DROPDOWNS[id] = { dd: dd, items: items, key: key, render: renderInner, menu: menu, trigger: trigger };
  menu.innerHTML = '';
  items.forEach(function(item, i) {
    var opt = document.createElement('button');
    opt.type = 'button';
    opt.className = 'dropdown-option';
    opt.innerHTML = renderInner(item, i);
    opt.onclick = function(e) {
      e.stopPropagation();
      state[key] = i;
      closeDropdowns();
      refreshDropdowns();
      regenerate();
    };
    menu.appendChild(opt);
  });
  trigger.onclick = function(e) {
    e.stopPropagation();
    var willOpen = !dd.classList.contains('open');
    closeDropdowns();
    if (willOpen) {
      dd.classList.add('open');
      menu.hidden = false;
      var active = menu.children[state[key]];
      if (active) active.scrollIntoView({ block: 'nearest' });
    }
  };
}

function refreshDropdowns() {
  Object.keys(DROPDOWNS).forEach(function(id) {
    var d = DROPDOWNS[id];
    var active = state[d.key];
    for (var i = 0; i < d.menu.children.length; i++) {
      d.menu.children[i].classList.toggle('active', i === active);
    }
    d.trigger.querySelector('.dropdown-current').innerHTML = d.render(d.items[active], active);
  });
}

function closeDropdowns() {
  Object.keys(DROPDOWNS).forEach(function(id) {
    DROPDOWNS[id].dd.classList.remove('open');
    DROPDOWNS[id].menu.hidden = true;
  });
}

function buildToggles() {
  setupDropdown('palette-dropdown', PALETTES, 'palette', paletteOptionHTML);
  setupDropdown('font-dropdown', FONT_SETS, 'fonts', fontOptionHTML);
  document.addEventListener('click', closeDropdowns);

  var layBox = document.getElementById('layout-toggles');
  LAYOUTS.forEach(function(lay, i) {
    var btn = document.createElement('button');
    btn.className = 'toggle-btn' + (i === state.layout ? ' active' : '');
    btn.textContent = lay.name;
    btn.onclick = function() { state.layout = i; updateToggles(); regenerate(); };
    layBox.appendChild(btn);
  });

  var cenBox = document.getElementById('center-toggles');
  CENTER_MODES.forEach(function(mode, i) {
    var btn = document.createElement('button');
    btn.className = 'toggle-btn' + (i === state.center ? ' active' : '');
    btn.textContent = mode.name;
    btn.onclick = function() { state.center = i; updateToggles(); regenerate(); };
    cenBox.appendChild(btn);
  });

  document.getElementById('btn-random').onclick = function() {
    state.palette = Math.floor(Math.random() * PALETTES.length);
    state.fonts = Math.floor(Math.random() * FONT_SETS.length);
    state.layout = Math.floor(Math.random() * LAYOUTS.length);
    updateToggles();
    regenerate();
  };

  document.getElementById('btn-shuffle').onclick = function() {
    state.seed = Math.floor(Math.random() * 100000);
    regenerate();
  };

  document.getElementById('btn-download').onclick = downloadSVG;
  document.getElementById('btn-print').onclick = function() { window.print(); };

  document.getElementById('btn-data').onclick = openDataModal;
  document.getElementById('btn-data-cancel').onclick = closeDataModal;
  document.getElementById('btn-data-apply').onclick = applyData;
  document.getElementById('data-modal').onclick = function(e) {
    if (e.target.id === 'data-modal') closeDataModal();
  };
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeDataModal();
  });
}

function updateToggles() {
  var groups = [
    { el: 'layout-toggles', val: state.layout },
    { el: 'center-toggles', val: state.center }
  ];
  groups.forEach(function(g) {
    var btns = document.getElementById(g.el).children;
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', i === g.val);
    }
  });
  refreshDropdowns();
}

function downloadSVG() {
  var svg = document.getElementById('cloud-svg');
  var content = '<?xml version="1.0" encoding="UTF-8"?>\n' + svg.outerHTML;
  var blob = new Blob([content], { type: 'image/svg+xml' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wordcloud.svg';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Data Modal ──
function wordsToCSV(words) {
  return words.map(function(w) { return w.word + ',' + w.count; }).join('\n');
}

function parseCSV(text) {
  var lines = text.split(/\r?\n/);
  var words = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var ci = line.indexOf(',');
    var word, count;
    if (ci === -1) {
      word = line;
      count = 1;
    } else {
      word = line.slice(0, ci).trim();
      count = parseInt(line.slice(ci + 1).trim(), 10);
    }
    if (!word) continue;
    if (word.toLowerCase() === 'word' && isNaN(count)) continue; // skip header row
    if (isNaN(count) || count < 1) count = 1;
    words.push({ word: word, count: count });
  }
  return words;
}

function openDataModal() {
  document.getElementById('inp-title').value = DATA.title || '';
  document.getElementById('inp-name').value = CENTER_NAME || '';
  document.getElementById('inp-csv').value = wordsToCSV(DATA.words);
  document.getElementById('data-error').hidden = true;
  document.getElementById('data-modal').hidden = false;
}

function closeDataModal() {
  document.getElementById('data-modal').hidden = true;
}

function applyData() {
  var words = parseCSV(document.getElementById('inp-csv').value);
  var err = document.getElementById('data-error');
  if (words.length === 0) {
    err.textContent = 'No valid words found. Use one "word,count" entry per line.';
    err.hidden = false;
    return;
  }
  words.sort(function(a, b) { return b.count - a.count; });
  var title = document.getElementById('inp-title').value.trim();
  DATA = { title: title || 'Word Cloud', words: words };
  CENTER_NAME = document.getElementById('inp-name').value.trim() || '007';
  document.title = DATA.title;
  closeDataModal();
  regenerate();
}

// ── URL Params ──
function stateToURL() {
  var params = new URLSearchParams();
  params.set('p', state.palette);
  params.set('f', state.fonts);
  params.set('l', state.layout);
  params.set('c', state.center);
  params.set('s', state.seed);
  history.replaceState(null, '', '?' + params.toString());
}

function stateFromURL() {
  var params = new URLSearchParams(window.location.search);
  if (params.has('p')) state.palette = Math.min(parseInt(params.get('p'), 10) || 0, PALETTES.length - 1);
  if (params.has('f')) state.fonts = Math.min(parseInt(params.get('f'), 10) || 0, FONT_SETS.length - 1);
  if (params.has('l')) state.layout = Math.min(parseInt(params.get('l'), 10) || 0, LAYOUTS.length - 1);
  if (params.has('c')) state.center = Math.min(parseInt(params.get('c'), 10) || 0, CENTER_MODES.length - 1);
  if (params.has('s')) state.seed = parseInt(params.get('s'), 10) || 42;
}

function regenerate() {
  stateToURL();
  var placements = placeWords();
  renderSVG(placements);
}

// ── Init ──
stateFromURL();
buildToggles();
updateToggles();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function() { regenerate(); });
} else {
  window.addEventListener('load', regenerate);
}
</script>
